<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="devopsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e17" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <radialGradient id="devopsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="helmBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="220" fill="url(#devopsBg)" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="110" r="90" fill="url(#devopsGlow)" />

  <!-- Subtle Hexagonal Grid Background -->
  <g opacity="0.1" stroke="#34d399" stroke-width="1">
    <polygon points="200,30 270,70 270,150 200,190 130,150 130,70" fill="none" />
    <polygon points="200,50 250,80 250,140 200,170 150,140 150,80" fill="none" />
    <polygon points="70,70 140,110 140,190 70,230 0,190 0,110" fill="none" />
    <polygon points="330,70 400,110 400,190 330,230 260,190 260,110" fill="none" />
  </g>

  <!-- Kubernetes Helm Wheel -->
  <g transform="translate(200, 110)">
    <!-- Outer Orbit Ring -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4" opacity="0.4" />
    
    <!-- Inner Ring -->
    <circle cx="0" cy="0" r="36" fill="none" stroke="#38bdf8" stroke-width="4.5" />
    
    <!-- 7 Helm Spokes with Handles -->
    <line x1="0" y1="-14" x2="0" y2="-46" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="0" cy="-46" r="4" fill="#34d399" />

    <line x1="0" y1="14" x2="0" y2="46" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="0" cy="46" r="4" fill="#34d399" />

    <line x1="-12" y1="-7" x2="-40" y2="-23" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="-40" cy="-23" r="4" fill="#34d399" />

    <line x1="12" y1="7" x2="40" y2="23" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="40" cy="23" r="4" fill="#34d399" />

    <line x1="-12" y1="7" x2="-40" y2="23" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="-40" cy="23" r="4" fill="#34d399" />

    <line x1="12" y1="-7" x2="40" y2="-23" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="40" cy="-23" r="4" fill="#34d399" />

    <!-- Center Hub -->
    <circle cx="0" cy="0" r="14" fill="url(#helmBlue)" />
    <circle cx="0" cy="0" r="6" fill="#f8fafc" />
  </g>
</svg>
