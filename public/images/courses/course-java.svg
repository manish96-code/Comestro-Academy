<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="javaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowJava" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="springGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#javaGrad)" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="50" y1="0" x2="50" y2="240" />
    <line x1="100" y1="0" x2="100" y2="240" />
    <line x1="150" y1="0" x2="150" y2="240" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="250" y1="0" x2="250" y2="240" />
    <line x1="300" y1="0" x2="300" y2="240" />
    <line x1="350" y1="0" x2="350" y2="240" />
  </g>

  <!-- Glowing Radial Orb -->
  <circle cx="200" cy="110" r="70" fill="#f97316" opacity="0.15" filter="blur(20px)" />

  <!-- Java Cup Icon & Steam -->
  <g transform="translate(170, 70)">
    <!-- Steam Curves -->
    <path d="M15 15 C 15 5, 25 0, 20 -12" stroke="#f97316" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.8" />
    <path d="M30 18 C 30 5, 42 0, 36 -16" stroke="#ef4444" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.9" />
    <path d="M45 15 C 45 5, 55 2, 50 -10" stroke="#f97316" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.8" />
    
    <!-- Coffee Cup Body -->
    <path d="M5 25 L55 25 C 55 52, 45 68, 30 68 C 15 68, 5 52, 5 25 Z" fill="url(#glowJava)" />
    <!-- Cup Handle -->
    <path d="M50 32 C 64 32, 64 48, 50 48" stroke="#f97316" stroke-width="4.5" fill="none" stroke-linecap="round" />
    <!-- Base Plate -->
    <ellipse cx="30" cy="74" rx="35" ry="6" fill="#64748b" opacity="0.6" />
  </g>

  <!-- Spring Boot Leaf Badge -->
  <g transform="translate(290, 25)">
    <rect width="85" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <circle cx="14" cy="12" r="5" fill="#10b981" />
    <text x="24" y="16" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">SPRING 3</text>
  </g>

  <!-- Title Watermark -->
  <text x="24" y="210" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" letter-spacing="0.5">JAVA MICROSERVICES</text>
  <text x="24" y="226" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">Kafka · Docker · PostgreSQL</text>
</svg>
