<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="javaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <radialGradient id="javaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="220" fill="url(#javaBg)" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="110" r="90" fill="url(#javaGlow)" />

  <!-- Minimalist Architectural Grid -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="55" x2="400" y2="55" />
    <line x1="0" y1="110" x2="400" y2="110" />
    <line x1="0" y1="165" x2="400" y2="165" />
    <line x1="100" y1="0" x2="100" y2="220" />
    <line x1="200" y1="0" x2="200" y2="220" />
    <line x1="300" y1="0" x2="300" y2="220" />
  </g>

  <!-- Centered Java / Microservices Emblem -->
  <g transform="translate(200, 110)">
    <!-- Microservice Orbit Ring -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />
    <circle cx="0" cy="-54" r="5" fill="#10b981" />
    <circle cx="47" cy="27" r="4" fill="#38bdf8" />
    <circle cx="-47" cy="27" r="4" fill="#f59e0b" />

    <!-- Steam Waves -->
    <path d="M-8 -15 C -8 -26, 0 -30, -4 -42" stroke="#fb923c" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85" />
    <path d="M4 -12 C 4 -24, 14 -28, 8 -44" stroke="#f43f5e" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9" />
    <path d="M16 -15 C 16 -26, 24 -28, 20 -40" stroke="#fb923c" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8" />

    <!-- Cup Body -->
    <path d="M-22 -5 L18 -5 C 18 20, 10 34, -2 34 C -14 34, -22 20, -22 -5 Z" fill="url(#cupGrad)" />
    <!-- Cup Handle -->
    <path d="M14 0 C 26 0, 26 14, 14 14" stroke="#fb923c" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <!-- Base Plate -->
    <ellipse cx="-2" cy="38" rx="28" ry="4.5" fill="#475569" opacity="0.7" />
  </g>
</svg>
