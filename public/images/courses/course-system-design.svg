<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="sysBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <radialGradient id="sysGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="220" fill="url(#sysBg)" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="110" r="95" fill="url(#sysGlow)" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08" stroke="#f59e0b" stroke-width="1">
    <rect x="60" y="40" width="70" height="35" rx="4" fill="none" />
    <rect x="270" y="40" width="70" height="35" rx="4" fill="none" />
    <rect x="165" y="150" width="70" height="35" rx="4" fill="none" />
    <line x1="95" y1="75" x2="200" y2="150" />
    <line x1="305" y1="75" x2="200" y2="150" />
  </g>

  <!-- Centered Distributed Architecture Graphic -->
  <g transform="translate(200, 110)">
    <!-- Gateway Box -->
    <rect x="-38" y="-22" width="76" height="44" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <!-- Gateway Icon (Server Stack Lines) -->
    <line x1="-20" y1="-8" x2="20" y2="-8" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-20" y1="8" x2="20" y2="8" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />

    <!-- Cluster Nodes (Top Left, Top Right, Bottom Left, Bottom Right) -->
    <line x1="-60" y1="-32" x2="-38" y2="-12" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="-68" cy="-36" r="9" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="-68" cy="-36" r="3.5" fill="#38bdf8" />

    <line x1="60" y1="-32" x2="38" y2="-12" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="68" cy="-36" r="9" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="68" cy="-36" r="3.5" fill="#38bdf8" />

    <line x1="-60" y1="32" x2="-38" y2="12" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="-68" cy="36" r="9" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <circle cx="-68" cy="36" r="3.5" fill="#10b981" />

    <line x1="60" y1="32" x2="38" y2="12" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="68" cy="36" r="9" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <circle cx="68" cy="36" r="3.5" fill="#10b981" />
  </g>
</svg>
