<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="sysGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#sysGrad)" />
  
  <g opacity="0.12" stroke="#f59e0b" stroke-width="1">
    <rect x="70" y="50" width="80" height="40" rx="4" fill="none" />
    <rect x="250" y="50" width="80" height="40" rx="4" fill="none" />
    <rect x="160" y="140" width="80" height="40" rx="4" fill="none" />
    <line x1="110" y1="90" x2="200" y2="140" />
    <line x1="290" y1="90" x2="200" y2="140" />
  </g>

  <!-- Glowing Radial Orb -->
  <circle cx="200" cy="115" r="70" fill="#f59e0b" opacity="0.15" filter="blur(22px)" />

  <!-- Distributed Architecture Architecture Graphic -->
  <g transform="translate(200, 115)">
    <!-- Load Balancer Center Box -->
    <rect x="-35" y="-22" width="70" height="44" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" />
    <text x="0" y="4" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">GATEWAY</text>

    <!-- Cluster Nodes -->
    <circle cx="-65" cy="-35" r="10" fill="#38bdf8" />
    <line x1="-55" y1="-30" x2="-35" y2="-15" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />

    <circle cx="65" cy="-35" r="10" fill="#38bdf8" />
    <line x1="55" y1="-30" x2="35" y2="-15" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />

    <circle cx="-65" cy="35" r="10" fill="#10b981" />
    <line x1="-55" y1="30" x2="-35" y2="15" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3" />

    <circle cx="65" cy="35" r="10" fill="#10b981" />
    <line x1="55" y1="30" x2="35" y2="15" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3" />
  </g>

  <!-- High Concurrency Badge -->
  <g transform="translate(285, 25)">
    <rect width="90" height="24" rx="12" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
    <circle cx="14" cy="12" r="5" fill="#f59e0b" />
    <text x="25" y="16" fill="#fef08a" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">SCALE 10M+</text>
  </g>

  <text x="24" y="210" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" letter-spacing="0.5">SYSTEM DESIGN</text>
  <text x="24" y="226" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">Sharding · Rate Limiting · Consensus</text>
</svg>
