<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="220" fill="url(#aiBg)" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="110" r="95" fill="url(#aiGlow)" />

  <!-- Abstract Grid/Constellation Geometry -->
  <g opacity="0.12" stroke="#c084fc" stroke-width="1">
    <line x1="120" y1="60" x2="200" y2="110" />
    <line x1="280" y1="60" x2="200" y2="110" />
    <line x1="120" y1="160" x2="200" y2="110" />
    <line x1="280" y1="160" x2="200" y2="110" />
    <circle cx="200" cy="110" r="75" fill="none" stroke-dasharray="4 6" />
  </g>

  <!-- Neural AI Network Graph -->
  <g transform="translate(200, 110)">
    <!-- Neural Synapse Connections -->
    <line x1="-50" y1="-32" x2="0" y2="0" stroke="#c084fc" stroke-width="2" opacity="0.75" />
    <line x1="-50" y1="32" x2="0" y2="0" stroke="#c084fc" stroke-width="2" opacity="0.75" />
    <line x1="0" y1="-45" x2="0" y2="0" stroke="#f43f5e" stroke-width="2" opacity="0.75" />
    <line x1="0" y1="45" x2="0" y2="0" stroke="#f43f5e" stroke-width="2" opacity="0.75" />
    <line x1="50" y1="-32" x2="0" y2="0" stroke="#c084fc" stroke-width="2" opacity="0.75" />
    <line x1="50" y1="32" x2="0" y2="0" stroke="#c084fc" stroke-width="2" opacity="0.75" />
    
    <line x1="-50" y1="-32" x2="0" y2="-45" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" stroke-dasharray="3 3" />
    <line x1="50" y1="-32" x2="0" y2="-45" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" stroke-dasharray="3 3" />
    <line x1="-50" y1="32" x2="0" y2="45" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" stroke-dasharray="3 3" />
    <line x1="50" y1="32" x2="0" y2="45" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" stroke-dasharray="3 3" />

    <!-- Connected Neural Nodes -->
    <circle cx="-50" cy="-32" r="7" fill="#38bdf8" />
    <circle cx="-50" cy="32" r="7" fill="#38bdf8" />
    <circle cx="50" cy="-32" r="7" fill="#38bdf8" />
    <circle cx="50" cy="32" r="7" fill="#38bdf8" />
    <circle cx="0" cy="-45" r="9" fill="#c084fc" />
    <circle cx="0" cy="45" r="9" fill="#c084fc" />

    <!-- Central Intelligent Core -->
    <circle cx="0" cy="0" r="18" fill="url(#coreGlow)" />
    <circle cx="0" cy="0" r="8" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
