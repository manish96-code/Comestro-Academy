<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#aiGrad)" />
  
  <g opacity="0.12" stroke="#c084fc" stroke-width="1">
    <line x1="140" y1="80" x2="200" y2="115" />
    <line x1="260" y1="80" x2="200" y2="115" />
    <line x1="140" y1="150" x2="200" y2="115" />
    <line x1="260" y1="150" x2="200" y2="115" />
    <line x1="140" y1="80" x2="140" y2="150" />
    <line x1="260" y1="80" x2="260" y2="150" />
  </g>

  <!-- Glowing Radial Orb -->
  <circle cx="200" cy="115" r="70" fill="#a855f7" opacity="0.18" filter="blur(22px)" />

  <!-- Neural AI Network Nodes -->
  <g transform="translate(200, 115)">
    <!-- Connected Neural Nodes -->
    <circle cx="-45" cy="-30" r="8" fill="#38bdf8" />
    <circle cx="-45" cy="30" r="8" fill="#38bdf8" />
    <circle cx="0" cy="-40" r="10" fill="#c084fc" />
    <circle cx="0" cy="0" r="14" fill="#f43f5e" />
    <circle cx="0" cy="40" r="10" fill="#c084fc" />
    <circle cx="45" cy="-30" r="8" fill="#38bdf8" />
    <circle cx="45" cy="30" r="8" fill="#38bdf8" />

    <!-- Neural Synapse Connections -->
    <line x1="-45" y1="-30" x2="0" y2="0" stroke="#c084fc" stroke-width="2.5" opacity="0.7" />
    <line x1="-45" y1="30" x2="0" y2="0" stroke="#c084fc" stroke-width="2.5" opacity="0.7" />
    <line x1="0" y1="-40" x2="0" y2="0" stroke="#f43f5e" stroke-width="2.5" opacity="0.7" />
    <line x1="0" y1="40" x2="0" y2="0" stroke="#f43f5e" stroke-width="2.5" opacity="0.7" />
    <line x1="45" y1="-30" x2="0" y2="0" stroke="#c084fc" stroke-width="2.5" opacity="0.7" />
    <line x1="45" y1="30" x2="0" y2="0" stroke="#c084fc" stroke-width="2.5" opacity="0.7" />
  </g>

  <!-- AI Agents Badge -->
  <g transform="translate(285, 25)">
    <rect width="90" height="24" rx="12" fill="#2e1065" stroke="#c084fc" stroke-width="1" />
    <circle cx="14" cy="12" r="5" fill="#c084fc" />
    <text x="25" y="16" fill="#e9d5ff" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">GENAI 2026</text>
  </g>

  <text x="24" y="210" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" letter-spacing="0.5">GENAI &amp; AGENTS</text>
  <text x="24" y="226" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">Python · LangChain · RAG · Fast inference</text>
</svg>
