<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="nextBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <radialGradient id="nextGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="220" fill="url(#nextBg)" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="110" r="95" fill="url(#nextGlow)" />

  <!-- Subtle Coordinate Lines -->
  <g opacity="0.1" stroke="#60a5fa" stroke-width="1">
    <circle cx="200" cy="110" r="50" fill="none" />
    <circle cx="200" cy="110" r="90" fill="none" stroke-dasharray="3 4" />
    <line x1="0" y1="110" x2="400" y2="110" />
    <line x1="200" y1="0" x2="200" y2="220" />
  </g>

  <!-- Centered React 19 / Next Atomic Geometry -->
  <g transform="translate(200, 110)">
    <!-- Center Core Nucleus -->
    <circle cx="0" cy="0" r="11" fill="#38bdf8" />
    <circle cx="0" cy="0" r="5" fill="#f8fafc" />

    <!-- Orbital Rings -->
    <ellipse cx="0" cy="0" rx="60" ry="22" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.9" />
    <ellipse cx="0" cy="0" rx="60" ry="22" fill="none" stroke="#60a5fa" stroke-width="2.5" transform="rotate(60)" opacity="0.85" />
    <ellipse cx="0" cy="0" rx="60" ry="22" fill="none" stroke="#818cf8" stroke-width="2.5" transform="rotate(120)" opacity="0.85" />

    <!-- Orbital Electron Points -->
    <circle cx="55" cy="0" r="3.5" fill="#ffffff" />
    <circle cx="-28" cy="48" r="3.5" fill="#ffffff" />
    <circle cx="-28" cy="-48" r="3.5" fill="#ffffff" />
  </g>
</svg>
